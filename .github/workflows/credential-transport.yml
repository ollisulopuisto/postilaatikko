name: macOS credential transport guards
on:
  pull_request:
    paths:
      - '.github/workflows/build-macos.yml'
      - '.github/workflows/credential-transport.yml'
      - 'scripts/macos_ci_credentials.py'
      - 'scripts/workflow-tests/test_macos*'
permissions:
  contents: read
jobs:
  credentials:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
          save-cache: false
      - run: uv run --no-project --with pyyaml python -m unittest discover -s scripts/workflow-tests -p test_macos_credentials_workflow.py -v
      - name: Native dummy-keychain smoke check (no Apple credentials)
        run: python3 scripts/workflow-tests/test_macos_keychain_transport.py -v
