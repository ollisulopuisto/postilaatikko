name: Release for macOS

on:
  push:
    tags: 'v*'

permissions:
  contents: read

jobs:
  build-and-publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: amd64
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GOARCH: ${{ matrix.arch }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Validate release version
        run: ./scripts/version.sh check "${{ github.ref_name }}"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Wails CLI
        id: wails
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails
          key: wails-${{ runner.os }}-${{ runner.arch }}-go1.26-v2.15.0

      - name: Install Wails CLI
        if: steps.wails.outputs.cache-hit != 'true'
        run: env -u GOARCH go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Import Developer ID certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$BUILD_CERTIFICATE_BASE64"
          test -n "$P12_PASSWORD"
          test -n "$KEYCHAIN_PASSWORD"
          KEYCHAIN_PATH="$RUNNER_TEMP/postilaatikko-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 -D -o "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -F 'Developer ID Application: Olli Sulopuisto (LWSR8T5392)'

      - name: Build macOS app
        run: make build

      - name: Sign app with Developer ID
        env:
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Olli Sulopuisto (LWSR8T5392)"
        run: |
          codesign --force --deep --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" build/bin/postilaatikko.app
          codesign --verify --deep --strict --verbose=2 build/bin/postilaatikko.app

      - name: Create drag-and-drop DMG
        run: |
          cd build/bin
          APP_BUNDLE="postilaatikko.app"
          DMG_NAME="Postilaatikko-${{ github.ref_name }}-darwin-${GOARCH}.dmg"
          mkdir -p dmg-staging
          cp -R "$APP_BUNDLE" dmg-staging/Postilaatikko.app
          ln -s /Applications dmg-staging/Applications
          hdiutil create \
            -volname "Postilaatikko" \
            -srcfolder dmg-staging \
            -ov \
            -format UDZO \
            "$DMG_NAME"
          hdiutil verify "$DMG_NAME"
          rm -rf dmg-staging
          ls -lh "$DMG_NAME"

      - name: Sign and verify DMG
        env:
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Olli Sulopuisto (LWSR8T5392)"
        run: |
          DMG_PATH="build/bin/Postilaatikko-${{ github.ref_name }}-darwin-${GOARCH}.dmg"
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$DMG_PATH"
          codesign --verify --verbose=2 "$DMG_PATH"

      # The ticket covers the app inside the DMG too, so the app is stapled
      # after the DMG is accepted and only then zipped.
      - name: Notarise and staple DMG and app, then create ZIP
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: LWSR8T5392
        run: |
          set -euo pipefail
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_PASSWORD" ]; then
            echo "::error::APPLE_ID / APPLE_APP_PASSWORD secrets are missing; a release must be notarised."
            exit 1
          fi
          cd build/bin
          DMG_NAME="Postilaatikko-${{ github.ref_name }}-darwin-${GOARCH}.dmg"
          ZIP_NAME="Postilaatikko-darwin-${GOARCH}.zip"
          result=$(xcrun notarytool submit "$DMG_NAME" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait --timeout 45m --output-format json) || true
          echo "$result"
          id=$(printf '%s' "$result" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          status=$(printf '%s' "$result" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')
          if [ "$status" != Accepted ]; then
            xcrun notarytool log "$id" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
            exit 1
          fi
          xcrun stapler staple "$DMG_NAME"
          xcrun stapler validate "$DMG_NAME"
          xcrun stapler staple postilaatikko.app
          xcrun stapler validate postilaatikko.app
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG_NAME"
          spctl --assess --type execute --verbose=2 postilaatikko.app
          ditto -c -k --keepParent postilaatikko.app "$ZIP_NAME"
          ls -lh "$DMG_NAME" "$ZIP_NAME"

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/postilaatikko-signing.keychain-db" || true

      - name: Ensure release exists and publish this architecture
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" \
              --title "Postilaatikko $TAG_NAME" \
              --generate-notes || true
            for attempt in 1 2 3 4 5; do
              if gh release view "$TAG_NAME" >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done
            gh release view "$TAG_NAME" >/dev/null
          fi
          gh release upload "$TAG_NAME" \
            "build/bin/Postilaatikko-${TAG_NAME}-darwin-${GOARCH}.dmg" \
            "build/bin/Postilaatikko-darwin-${GOARCH}.zip" \
            --clobber
