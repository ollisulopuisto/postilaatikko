app-id: io.github.ollisulopuisto.postilaatikko
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: postilaatikko

finish-args:
  # Network access for email sync
  - --share=network
  # IPC is required for X11 and Wayland
  - --share=ipc
  # Display access
  - --socket=wayland
  - --socket=fallback-x11
  # GPU access for hardware acceleration
  - --device=dri
  # Sleep/wake detection for sync management
  - --system-talk-name=org.freedesktop.login1
  # Secret Service access for the existing go-keyring integration
  - --talk-name=org.freedesktop.secrets

modules:
  - name: postilaatikko
    buildsystem: simple
    build-commands:
      # Install pre-built binary from host
      - install -Dm755 build/bin/postilaatikko /app/bin/postilaatikko
      - install -Dm755 build/bin/postilaatikko-helper /app/bin/postilaatikko-helper

      # Install desktop file with correct app ID
      - install -Dm644 build/linux/io.github.ollisulopuisto.postilaatikko.desktop /app/share/applications/io.github.ollisulopuisto.postilaatikko.desktop
      - desktop-file-edit --set-key=Icon --set-value=io.github.ollisulopuisto.postilaatikko /app/share/applications/io.github.ollisulopuisto.postilaatikko.desktop
      - desktop-file-edit --set-key=Exec --set-value='postilaatikko %U' /app/share/applications/io.github.ollisulopuisto.postilaatikko.desktop

      # Install icon
      - install -Dm644 build/appicon.png /app/share/icons/hicolor/256x256/apps/io.github.ollisulopuisto.postilaatikko.png

      # Install metainfo (AppStream metadata)
      - install -Dm644 build/flatpak/io.github.ollisulopuisto.postilaatikko.metainfo.xml /app/share/metainfo/io.github.ollisulopuisto.postilaatikko.metainfo.xml

    sources:
      - type: dir
        path: ../..
